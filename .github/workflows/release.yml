name: Release Build

# Build Mnemosyne binaries for macOS (arm64 + x86_64), Linux (arm64 + x86_64)
# and Windows (x86_64) on native runners, then create a GitHub Release whose
# body is taken verbatim from `release.md` and attach all binaries.
#
# Ordering: triggered by the CI workflow's completion, so it runs AFTER
# `make check && make test` succeed on the same push (never in parallel with
# tests). Manual trigger via workflow_dispatch is also supported.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Static analysis gate: fmt + clippy + check must pass before any platform
  # build is dispatched. Keeps the matrix fast-failing on obvious issues.
  lint:
    name: Static analysis (fmt + clippy)
    runs-on: ubuntu-latest
    # Gate: only run the release pipeline when the triggering CI run actually
    # succeeded (workflow_dispatch bypasses the check).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run events default to the default branch; check out the
          # exact commit that triggered the CI run instead.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-cargo-${{ hashFiles('**/Cargo.lock') }}
          # Reuse the previous cache when Cargo.lock is unchanged (fast
          # incremental rebuilds between pushes).
          restore-keys: |
            ${{ runner.os }}-lint-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64: macos-latest runs natively on arm64.
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          # macOS x86_64: cross-compile from the arm64 runner; the macOS SDK
          # ships with both arch slices so no extra linker is needed.
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          # Linux arm64: native arm64 runner.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          # Linux x86_64: native amd64 runner.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          # Windows x86_64: native runner, MSVC toolchain (rustup default).
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # Use the `ci` profile (thin LTO + 16 codegen units) — fat LTO + 1 unit
      # from `release` makes every platform compile take minutes longer for a
      # binary-size gain that CI artifacts don't need.
      - name: Build release binary
        run: cargo build --profile ci --target ${{ matrix.target }} --bin mnemosyne

      # Rename the binary to a plain per-platform name (the archive keeps the
      # platform in its FILENAME, the inner binary is uniformly `mnemosyne`
      # so install.sh can extract and use it without platform-specific names).
      # Note: `--profile ci` outputs to target/<triple>/ci/ (not release/) —
      # a custom profile's artifacts live in a directory named after itself.
      - name: Rename binary per platform
        shell: bash
        run: |
          cp target/${{ matrix.target }}/ci/mnemosyne${{ matrix.ext }} \
             mnemosyne${{ matrix.ext }}

      # Ship the customizable observation-marker word lists WITH the binary:
      # the runtime resolves them from the executable's directory, so a
      # download that puts the binary and the two markers_*.json files side by
      # side works out of the box, and users can edit the JSON to customize
      # what conversations produce facts.
      - name: Stage marker word lists
        shell: bash
        run: |
          cp config/markers_zh.json config/markers_en.json .

      # Package everything into ONE archive per platform. install.sh downloads
      # this single file, extracts it into .mnemosyne/, and the binary finds
      # the marker lists next to itself.
      - name: Package platform archive
        shell: bash
        run: |
          tar -czf mnemosyne-${{ matrix.target }}.tar.gz \
              mnemosyne${{ matrix.ext }} markers_zh.json markers_en.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnemosyne-${{ matrix.target }}
          path: mnemosyne-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release from release.md
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Extract the version from release.md (first line: "# Mnemosyne v0.1.3").
      # Fail hard if no version is found — an empty tag would create a broken
      # release instead of surfacing the missing-version problem.
      - name: Read version from release.md
        id: version
        run: |
          VER=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' release.md | head -1)
          if [ -z "$VER" ]; then
            echo "::error::no version (vX.Y.Z) found in release.md" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      # The tag comes from release.md, but the binary reports the version in
      # Cargo.toml. If the two disagree, the release would advertise a version
      # the binary does not claim (and the CHANGELOG would too), so refuse to
      # release instead of publishing a contradictory tag.
      - name: Verify Cargo.toml agrees with release.md
        run: |
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "v${CARGO_VER}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Cargo.toml version (v${CARGO_VER}) != release.md version (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Merge every artifact's files into dist/ root so a plain
          # `files: dist/*` glob picks up all five archives (no nested
          # per-artifact subdirectories to mismatch).
          merge-multiple: true

      # Verify ALL five platform archives exist BEFORE creating the release.
      # softprops/action-gh-release creates the release first and uploads files
      # after — if files were missing it would publish a body-only release
      # (exactly the broken v0.1.0). Failing here prevents any release at all.
      - name: Verify all 5 platform archives present
        run: |
          MISSING=0
          for f in \
            mnemosyne-aarch64-apple-darwin.tar.gz \
            mnemosyne-x86_64-apple-darwin.tar.gz \
            mnemosyne-aarch64-unknown-linux-gnu.tar.gz \
            mnemosyne-x86_64-unknown-linux-gnu.tar.gz \
            mnemosyne-x86_64-pc-windows-msvc.tar.gz
          do
            if [ ! -f "dist/$f" ]; then echo "MISSING: $f"; MISSING=1; fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi
          echo "All 5 platform archives present ✓"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Body is read verbatim from release.md at the repo root.
          body_path: release.md
          # Attach every downloaded archive (mac×2, linux×2, windows×1).
          files: dist/*
          # Tag/name taken from release.md's version line (e.g. v0.1.3).
          tag_name: ${{ steps.version.outputs.version }}
          name: Mnemosyne ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
