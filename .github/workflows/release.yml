name: Release Build

# Build Mnemosyne binaries for macOS (arm64 + x86_64), Linux (arm64 + x86_64)
# and Windows (x86_64) on native runners, then create a GitHub Release whose
# body is taken verbatim from `release.md` and attach all binaries. Triggered
# on every push to `main` (or manually via workflow_dispatch).
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Static analysis gate: fmt + clippy + check must pass before any platform
  # build is dispatched. Keeps the matrix fast-failing on obvious issues.
  lint:
    name: Static analysis (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64: macos-latest runs natively on arm64.
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          # macOS x86_64: cross-compile from the arm64 runner; the macOS SDK
          # ships with both arch slices so no extra linker is needed.
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          # Linux arm64: native arm64 runner.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          # Linux x86_64: native amd64 runner.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          # Windows x86_64: native runner, MSVC toolchain (rustup default).
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin mnemosyne

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnemosyne-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mnemosyne${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release from release.md
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Extract the version from release.md (first line: "# Mnemosyne v0.1.0").
      - name: Read version from release.md
        id: version
        run: |
          VER=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' release.md | head -1)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Merge every artifact's files into dist/ root so a plain
          # `files: dist/*` glob picks up all five binaries (no nested
          # per-artifact subdirectories to mismatch).
          merge-multiple: true

      - name: List downloaded binaries
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Body is read verbatim from release.md at the repo root.
          body_path: release.md
          # Attach every downloaded binary (mac×2, linux×2, windows×1).
          files: dist/*
          # Tag/name taken from release.md's version line (e.g. v0.1.0).
          tag_name: ${{ steps.version.outputs.version }}
          name: Mnemosyne ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
