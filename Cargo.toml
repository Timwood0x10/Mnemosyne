[package]
name = "LoreScope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["TimWood"]
description = "Memory Distillation MCP Server - extracts and distills memories from conversations"
license = "Apache-2.0"
repository = "https://github.com/TimWood/memory_distill"
homepage = "https://github.com/TimWood/memory_distill"
documentation = "https://github.com/TimWood/memory_distill#readme"
keywords = ["mcp", "memory", "llm", "agent", "sqlite-vec"]
categories = ["asynchronous", "database-implementations"]

[lib]
name = "lore_scope"
path = "src/lib.rs"

[[bin]]
name = "lore-scope"
path = "src/main.rs"

[dependencies]
# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async trait
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Async runtime: keep only the features used by the server.
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "sync"] }

# ID generation
uuid = { version = "1.17", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for remote embedding
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = true }

# SQLite + sqlite-vec for vector search
rusqlite = { version = "0.40.1", features = ["bundled"] }
sqlite-vec = "0.1"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Parallelism
rayon = "1.10"

# In-memory graph for relation_graph traversal (frozen decision: SQLite + petgraph)
petgraph = "0.6"

# Multi-pattern string matching for alias resolution
aho-corasick = "1.1"

# HNSW vector index for entity resolution
instant-distance = "0.6"

# Entity embedding for fuzzy resolution (ONNX local, no API key).
# This dependency is intentionally opt-in because ONNX and tokenizers dominate
# clean-build time and binary size.
fastembed = { version = "4", optional = true }

[dev-dependencies]
tokio = { version = "1.45", features = ["full", "test-util"] }
tempfile = "3.20"

[features]
default = ["remote-embed"]
remote-embed = ["dep:reqwest"]
local-embed = ["dep:fastembed"]

# Fast edit-build-run cycles. Dependencies receive light optimization so debug
# builds remain usable without sacrificing incremental compilation.
[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1
debug = false

# Balanced production build: small enough to ship, much faster than fat LTO.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Distribution build: prioritize the smallest executable over build latency.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
